interface:
  display_name: "Code Auditor"
  short_description: "Independent pre-merge review of a git diff, PR, or named files; also full-spectrum project audits"
  default_prompt: "Use $code-auditor as an independent reviewer of the requested PR, git diff, or named files. Hunt functional regressions, missed scenarios, wrong assumptions, concurrency bugs, and test gaps; do not defend the author's approach. Also use it for a full-spectrum project audit across correctness, security, performance, readability, testing, and architecture. Keep maintainability-only and structure/refactoring reviews, product-code edits, and repository health reports spanning compliance, privacy, cost, or accessibility out of scope. Do not modify product code. Follow the user's language."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
