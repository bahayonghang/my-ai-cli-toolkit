<style>

    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

    display: flex;
    justify-content: space-between;

    outline-offset: calc(var(--stroke-thick) * -1);
  }
  .ha-details__body {
    border-top: var(--stroke-thin) solid var(--border);
    padding: var(--space-4) var(--space-5);

  }
