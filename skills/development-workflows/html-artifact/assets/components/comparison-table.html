<!-- comparison-table: Compare alternatives by a shared set of dimensions. Use for genuine side-by-side decisions. -->
<style>
  .ha-comparison-table {
    margin: var(--space-6) 0;
  }
  .ha-comparison-table .verdict-column {
    color: var(--accent-strong);
    font-weight: 700;
  }
</style>

<div class="table-wrap ha-comparison-table">
  <table class="table--matrix">
    <caption>HTML artifact composition layers</caption>
    <thead>
      <tr>
        <th scope="col">Layer</th>
        <th scope="col">Decision</th>
        <th scope="col">Bundled source</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Page</th>
        <td>Choose the narrative skeleton.</td>
        <td class="verdict-column">Template references</td>
      </tr>
      <tr class="key-row">
        <th scope="row">Section</th>
        <td>Match the information shape to a component.</td>
        <td class="verdict-column">Component snippets</td>
      </tr>
      <tr>
        <th scope="row">Foundation</th>
        <td>Apply layout primitives and semantic tokens.</td>
        <td class="verdict-column">Starter and tokens</td>
      </tr>
    </tbody>
  </table>
</div>
