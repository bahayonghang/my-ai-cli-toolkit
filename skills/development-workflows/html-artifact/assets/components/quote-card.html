<!-- quote-card: Emphasize a sourced statement or governing rule. Always retain a visible citation. -->
<style>
  .ha-quote-card {
    margin: var(--space-6) 0;
    border: var(--stroke-thin) solid var(--border);
    border-left: var(--stroke-thick) solid var(--accent);
    border-radius: var(--radius-md);
    background: var(--accent-soft);
    box-shadow: var(--shadow-sm);
    padding: var(--space-6);
  }
  .ha-quote-card blockquote { margin: 0; }
  .ha-quote-card blockquote p {
    margin: 0;
    color: var(--text);
    font-family: var(--font-display);
    font-size: var(--space-6);
    line-height: 1.4;
  }
  .ha-quote-card figcaption {
    margin-top: var(--space-4);
    color: var(--text-muted);
    font-size: var(--space-3);
  }
</style>

<figure class="ha-quote-card">
  <blockquote>
    <p>Every artifact must be self-contained, semantic, accessible, and reviewable.</p>
  </blockquote>
  <figcaption>HTML Artifact output contract</figcaption>
</figure>
