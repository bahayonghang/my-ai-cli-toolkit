interface:
  display_name: "Web Research"
  short_description: "跨平台来源发现、核验与确认后本地归档"
  default_prompt: "Use $web-research to find, verify, and locally archive specific web sources. Run the fixed stages in order: lock the target and platforms, discover with 2-3 query variants per sub-target using whatever search capability the environment actually has, verify each candidate against its landing page, then emit the candidate-list JSON with coverage and gaps and stop. Archiving is a separate stage that requires an explicit same-turn confirmation of which candidates to save; search results never convert to download automatically. Keep every platform read-only — never post, comment, like, follow, or otherwise change account state, and never control a desktop or mobile client UI. Logged-in-session and private-data reads need same-turn authorization that states the platform, the exact keyword, and the expected count, and that authorization never transfers to downloading. Prefer anonymous public routes and never bypass CAPTCHAs, login walls, paywalls, rate limits, or region restrictions. Never print or save cookies, tokens, API keys, or sensitive URL parameters. Never overwrite existing artifacts. Probe optional tools such as yt-dlp or gh before use and report the gap instead of installing them. For topic research, comparison, or cited report writing, defer to deep-research-pro instead."
