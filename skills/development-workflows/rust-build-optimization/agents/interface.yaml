interface:
  display_name: "Rust Build Optimization"
  short_description: "Measure-first diagnosis and speedup of slow Rust/Cargo builds"
  default_prompt: "Use $rust-build-optimization to diagnose and speed up a slow Rust build. First frame the complaint (cold vs warm build, dev vs release vs CI) and record a reproducible baseline, then measure with cargo build --timings and escalate to -Zself-profile/measureme, cargo-llvm-lines, or a linker A/B test when the bottleneck is still ambiguous. Apply only fixes justified by measurements — faster linkers (lld default on x86_64 Linux since Rust 1.90, mold, wild), dev-profile and debuginfo tuning, dependency opt-level overrides, release incremental for local builds, workspace splitting for oversized crates, and CI caching with sccache plus CARGO_INCREMENTAL=0. Label nightly-only options (Cranelift, -Zthreads) and never change release runtime settings (codegen-units, lto, opt-level) without stating the tradeoff. Finish by re-measuring and reporting before/after times. Runtime performance optimization and non-Rust build systems are out of scope."
