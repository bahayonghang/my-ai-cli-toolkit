interface:
  display_name: "Trellis Plan Review"
  short_description: "Review one Trellis task scope into one combined report and one handoff prompt"
  default_prompt: "Use $trellis-plan-review to review one selected Trellis task scope. Resolve the root task, then run plan_precheck.py with --include-descendants so the root and recursive current/archive children form one ordered scope; fail closed on missing or ambiguous members, malformed metadata, cycles, duplicate membership, unsafe paths, or parent-backlink mismatches. Read every member's task.json and planning artifacts, run Passes 1-7 per member under its own status, and use Pass 5 to check parent-child scope, explicit cross-task ordering, shared contracts, and exclusions. Deduplicate the same cross-task root cause before assigning global TPR ids, retaining every affected task and task-qualified location. Invoke write_review_report.py exactly once with the root task and persist only .trellis/reviews/<root-task-name>.md; do not create child reports or touch historical ones. Then print the aggregate verdict, that one report path, and exactly one text-fenced scope-wide handoff prompt from references/handoff-prompt.md. Never edit planning artifacts or product code, fix a defect, run a state-writing Trellis command, or produce a revised plan. Drop uncited findings and disclose the shared agent blind-spot boundary."
