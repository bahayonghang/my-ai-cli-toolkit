interface:
  display_name: "Trellis Plan Review"
  short_description: "Independently review Trellis task planning artifacts and report cited findings"
  default_prompt: "Use $trellis-plan-review to review the planning artifacts in a .trellis/tasks/ directory. Resolve the task directory first (explicit path, then `task.py current`, then a slug search that may reach another repository), and read task.json before the artifacts — its status decides whether the implementation-drift pass applies. Run the bundled plan_precheck.py for the mechanical layer: artifact presence, template placeholder residue, path:line citation resolution, and R/AC identifier cross-reference; report blocking items from it before the judgment passes. Then run the seven judgment passes: verify every repository claim against the real code, split each confirmed fact into observation and inference and check both, trace every acceptance-criterion clause (not every criterion) to a requirement and a design mechanism, recompute each calculation including its unit sources, cross-check requirements against out-of-scope and rejected options and step lists, test each criterion for a single pass/fail result under stated preconditions, and — once the task has started — compare the real change against the planned change list to surface undeclared mechanisms. Output four sections: verdict line, numbered findings with severity and evidence, an unverified list, and the parts that held up. This skill is read-only: never edit the artifacts or the code, never fix a defect, never run task.py start, and never produce a revised plan. Drop any finding you cannot cite, and disclose that an agent reviewing an agent's plan shares most of its blind spots."
