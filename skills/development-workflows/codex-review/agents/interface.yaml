interface:
  display_name: Codex Review in Herdr
  short_description: 经 Herdr 发起一个只读 Codex reviewer 并核验具体发现。
  default_prompt: >-
    仅在已建立 Herdr + Codex 审查意图时使用本包；若我是已分配的 leaf reviewer，则直接审查，不调用任何编排或更多 Agent。
    捕获明确 cwd、唯一范围和输入证据，通过已加载 herdr-orchestra 的 delegation 契约启动一个新交互 Codex，
    使用 --sandbox read-only --ask-for-approval never --no-alt-screen，保留用户模型选择，否则继承配置。
    不修复、写 CHANGELOG、改 Git/config/hooks/trust 或安装；同一 reviewer 分段恢复，不写 temp file 或扩大 sandbox。
    核验完整结果与未变化输入，报告具体发现、证据、范围漂移和未验证项；不把 lifecycle 当作审查通过。
compatibility:
  canonical_format: agent-skills
  adapter_targets: [openai, claude, generic, agent-skills-compatible]
  activation:
    mode: explicit
  degradation:
    generic: >-
      adapter_targets 仅表示格式意向，不证明 runtime 加载。依赖缺失或加载同名第三方入口时报告来源不匹配，
      不改安装、不直接绕过 Herdr 启动，不声称完整审查或跨宿主运行已通过。
