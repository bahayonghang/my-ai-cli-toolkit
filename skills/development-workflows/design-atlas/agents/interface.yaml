interface:
  display_name: "Design Atlas"
  short_description: "Pick one of 202 brand, style, theme, and scene designs (automatically when none is set), write DESIGN.md, build UI from it, and check it for AI slop"
  default_prompt: "Use $design-atlas to give this project a design language and build UI from it. If the project root already has DESIGN.md, implement from it. If the user names a brand, style, theme, or scene, show and apply it. If the user asks to compare, run route --n 3 and wait. Otherwise run the bundled design_catalog.py signals and route commands with the user's words, take the first pick without waiting, show a Picks block with the reason, two alternates, and how to switch, then run apply to write DESIGN.md. If the user names a scene and also a brand or style, offer those candidates and wait. Build one token layer, implement the requested UI with all component states, verify it in a running page with desktop and mobile screenshots, then run slop_check.mjs until there is no open FAIL, fix or waive every REFLEX in DESIGN.md, walk the judged anti-slop checklist, and run a fresh-context review. For audit <path>, report findings only and change no files. For brand entries, do not copy logos, wordmarks, brand names, imagery, or proprietary font files. Never invent metrics, quotes, or logos."
