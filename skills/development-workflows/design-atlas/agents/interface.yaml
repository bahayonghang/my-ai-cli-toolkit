interface:
  display_name: "Design Atlas"
  short_description: "Pick one of 203 brand, style, theme, and scene designs (automatically when none is set), write DESIGN.md, build UI from it, and check it for AI slop"
  default_prompt: "Use $design-atlas to give this project a design language and build UI from it. If the project root already has DESIGN.md, implement from it. If the user names a brand, style, theme, or scene, show and apply it. For comparisons, show named candidates or run route --n 3 for open-ended options, then wait. Apply style:scandinavian when named or selected. For an unnamed design with no existing DESIGN.md, run the bundled design_catalog.py signals and route commands with the user's words, take the first pick without waiting, show a Picks block with the reason, two alternates, and how to switch, then run apply to write DESIGN.md. If the user names a scene and also a brand or style, offer those candidates and wait. Build one token layer, implement the requested UI with all component states, select applicable craft-polish.md mechanisms while preserving the existing design, component API/props and dependencies, verify their interruption, access, reduced-motion and fallback behavior, then verify it in a running page with desktop and mobile screenshots, then run slop_check.mjs until there is no open FAIL, fix or waive every REFLEX in DESIGN.md, walk the judged anti-slop checklist, and run a fresh-context review. When signals reports gpui, use the crate that declares the GPUI dependency as the project root and follow references/implementation-gpui.md: probe the resolved GPUI source before writing a call, keep one Rust token module, verify in the native window at the default size and the minimum width in light and dark, and report that the mechanical gates did not run when slop_check.mjs exits 2 on Rust-only source. When the user wants an existing page restyled or de-templated, follow the Restyle branch: diagnose first, then keep the current DESIGN.md, capture the current look into DESIGN.md, or route and apply a different entry, keep business logic and required information, and report what changed, what stayed, and what is unverified. For audit <path>, report findings only and change no files. For brand entries, do not copy logos, wordmarks, brand names, imagery, or proprietary font files. Never invent metrics, quotes, or logos."
