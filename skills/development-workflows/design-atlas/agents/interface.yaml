interface:
  display_name: "Design Atlas"
  short_description: "List 153 categorized brand, style, and scene designs, write one project-root DESIGN.md, and implement UI from it"
  default_prompt: "Use $design-atlas to choose one design language for this project. If the project root already has DESIGN.md, implement from it. Otherwise run the bundled design_catalog.py list or search command. When the user asks for BI, analytics, 经营分析, 数据看板, or another business scene, search or list --kind scene first. If the user names a scene and also a brand or style, offer those candidates and wait; do not merge two entries into one DESIGN.md. After the choice, run apply to write that single DESIGN.md. Then build one token layer for the project stack, implement the requested UI with all component states, and verify it in a running page with desktop and mobile screenshots. For brand entries, do not copy logos, wordmarks, brand names, imagery, or proprietary font files. A scene entry does not copy brand assets and does not use those brand limits unless a brand entry was chosen."
