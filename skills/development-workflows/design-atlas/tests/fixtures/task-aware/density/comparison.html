<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare daily hire rates and assemble an equipment list.">
  <title>Field equipment directory</title>
  <link rel="stylesheet" href="directory.css">
  <style>
    .record {
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) minmax(15rem, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid var(--rule);
    }
    @media (min-width: 721px) {
      .specs { display: grid; grid-template-columns: 4rem 1fr 6rem; }
      .specs span + span { margin-inline-start: 0; }
      .rate { text-align: right; font-variant-numeric: tabular-nums; }
    }
    @media (max-width: 720px) {
      .record { grid-template-columns: 1fr auto; gap: 4px 10px; }
      .name, .specs { grid-column: 1; }
      .actions { grid-column: 2; grid-row: 1 / 3; flex-direction: column; }
    }
  </style>
  <script defer src="directory.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Field equipment</h1>
      <p>Compare daily hire rates and pick equipment for a field visit.</p>
    </header>
    <output aria-live="polite">Pick list empty</output>
    <section id="records" aria-label="Equipment directory" tabindex="0"></section>
  </main>
</body>
</html>
