<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiver fixture</title>
<style>
:root {
  --color-paper: #000;
  --color-ink: oklch(96% 0 250);
  --font-display: Inter, sans-serif;
  --font-body: "Public Sans", sans-serif;
}
html, body { overflow-x: clip; }
body { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); }
h1 { font-family: var(--font-display); }
</style>
</head>
<body>
  <h1>A manifesto printed on a black stage</h1>
  <p>The manifesto sets long declarative lines and lets the paper do the shouting.</p>
</body>
</html>
