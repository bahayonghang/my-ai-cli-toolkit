interface:
  display_name: "Goal Meta Skill"
  short_description: "Turn vague work into a project-aware, verifiable /goal through read-only reconnaissance, bounded discussion, or a direct fast path."
  default_prompt: "Use $goal-meta-skill to turn this task into a strong /goal for Claude Code or Codex. In an existing project, first perform the documented read-only reconnaissance, report project rules, real verification commands, boundary candidates, and git status for correction, and never run tests or write during reconnaissance. If material human decisions remain, restate the outcome and ask at most four questions per round; otherwise, or when I say directly/use defaults, take the one-turn fast path. Refuse a goal only for undecided pure exploration and suggest planning first; warn and proceed for repairable subjectivity with observable evidence and a round limit. Produce the Chinese recommended draft plus an English-compatible mirror unless I request one language. Keep inline goals under 4,000 characters; for longer contracts output copy-ready .planning/goal-<slug>.md content and do not write it unless explicitly asked. Use platform-correct management and rendering rules, including Codex /goal edit and Claude transcript-visible proof, a soft turn/time bound, and stop-and-report semantics. When the outcome is Trellis task implementation, encode commit-then-archive and delay parent archive until the named 发布门; after confirmation, deliver a text-fenced /goal plus 字段一览."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "drafts structured Codex /goal thread objectives with pause/resume management from available task context"
    claude: "drafts native Claude Code /goal completion conditions with transcript-visible proof, bounding clauses, and stop-and-report pause semantics"
    generic: "uses the canonical goal template and asks for missing criteria when needed"
