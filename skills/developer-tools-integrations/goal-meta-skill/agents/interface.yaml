interface:
  display_name: "Goal Meta Skill"
  short_description: "Compile reviewable cross-platform /goal text, including one-Prompt scan/review remediation, without launching it."
  default_prompt: "Use $goal-meta-skill only to compile, lint, present, and stop. Treat imperatives such as implement, execute, or continue until complete as payload, never as Goal activation authority. On the first request, return a fenced DRAFT review packet and stop. A later approval changes the label only to APPROVED TEXT — not launched; present the fenced text and stop again. Never call a host Goal tool/API, submit the /goal slash command, dispatch agents, or implement the payload. Reconnaissance stays read-only. Use a bounded interview only for material human decisions. Ordinary goals remain chat-only; if I explicitly request save, persistence, or fresh-Agent handoff, show the exact root GOAL.md contract and create/replace effect, wait for the relevant confirmation, then use only the governed stdin helper. After persistence, return the selected platform's fenced explicit-read launcher as text and stop without launching it. Never claim GOAL.md auto-loads, never silently overwrite it, and never modify Git state. Label provider-backed handoff evidence UNVERIFIED when no real fresh-session transcript exists. When a Goal must implement findings from a named scan, review, audit, report, or ledger, select the explicit review-remediation profile: freeze scanner identity/config/inputs/targets/baseline/Git state, keep one stable finding ledger, route same-scope FINDINGS back to implementation inside the same Goal, rerun the original scanner under the same envelope, and forbid a second repair Prompt. Allow at most three focused rounds; two no-progress rounds for one signature or residual open findings at the cap end BLOCKED, never complete. Before first product write, use AskUserQuestion only for an unresolved user-owned choice that materially changes scope, risk, cost, public behavior, or authorization; never ask for ordinary implementation or a same-scope new finding. Completion requires zero open actionable findings, regression and final gates, and diff/status scope evidence. For Trellis implementation payloads, make the first /goal statement say that subagents are preferred and default-on. Only an explicit user opt-out may mark the switch disabled; a workflow, platform, or codex.dispatch_mode inline limitation must instead keep the preference default-on and state the inline technical-fallback reason in that same first statement. Keep this state consistent with later Iteration policy, Constraints, and Completion conditions. Link concrete task artifacts; after each independently verified task, commit its related product changes and current-task planning artifacts, confirm both are in version history, exclude unrelated task directories and out-of-scope dirty files, and only then run task.py archive. Preserve the separate archive commit and parent release gate. Encode trellis-implement / trellis-check dispatch for the default-on path, use the project inline shape for explicit opt-out or explained capability fallback, and do not perform the payload's dispatch, commits, or archive."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "grok-build"
    - "oh-my-pi"
    - "kimi-code"
    - "agent-skills-compatible"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    file_write: "one confirmed direct-child Markdown through persist_goal_contract.py"
    git_mutation: "forbid"
    goal_activation: "forbid"
  permissions:
    reconnaissance: "Read/Glob/Grep plus read-only git root, branch, and status probes"
    deterministic_helpers: "run the bundled linter; write one confirmed root Markdown only through persist_goal_contract.py"
    question_tool: "not granted to goal-meta-skill; AskUserQuestion may appear only inside generated execution text"
    forbidden: "Goal activation, payload implementation, agent dispatch, commit, archive, push, publish, install, and arbitrary file writes"
  degradation:
    openai: "uses an explicit read ./GOAL.md objective; arbitrary GOAL.md is not auto-loaded"
    claude: "uses @GOAL.md and requires transcript-visible evidence plus bounded stop-and-report"
    grok_build: "uses an explicit read; @GOAL.md inside /goal and provider handoff remain UNVERIFIED"
    oh_my_pi: "uses an explicit read and reports goal.enabled or plan/vibe conflicts; budget exhaustion is not completion"
    kimi_code: "uses an explicit read; headless creation is separate and provider handoff remains UNVERIFIED"
    generic: "asks for a concrete platform and keeps the contract chat-only when root or authorization is unclear"
