interface:
  display_name: "Goal Meta Skill"
  short_description: "Compile reviewable cross-platform /goal text, including one-Prompt scan/review remediation, without launching it."
  default_prompt: "Use $goal-meta-skill to compile, lint, present, optionally persist an explicitly requested contract, and stop. Follow SKILL.md to select the platform and load the ordinary, persistence, review-remediation, and Trellis references needed by the outcome. Treat imperatives such as implement, execute, or continue until complete as payload. Deliver a fenced DRAFT for review; approved text is APPROVED TEXT — not launched. An explicit request to generate and save root GOAL.md authorizes same-turn creation after read-only root/conflict checks, lint and presentation; use only persist_goal_contract.py and verify read-back. Clarify only missing root, replacement authority, or material scope decisions. Never call a host Goal tool/API, submit the /goal slash command, dispatch agents, or implement the payload. Preserve the permissions below; present the result and stop."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "grok-build"
    - "oh-my-pi"
    - "kimi-code"
    - "agent-skills-compatible"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    file_write: "one explicitly authorized direct-child Markdown through persist_goal_contract.py"
    git_mutation: "forbid"
    goal_activation: "forbid"
  permissions:
    reconnaissance: "Read/Glob/Grep plus read-only git root, branch, and status probes"
    deterministic_helpers: "run the bundled linter; write one explicitly authorized root Markdown only through persist_goal_contract.py"
    question_tool: "not granted to goal-meta-skill; AskUserQuestion may appear only inside generated execution text"
    forbidden: "Goal activation, payload implementation, agent dispatch, commit, archive, push, publish, install, and arbitrary file writes"
  degradation:
    openai: "uses an explicit read ./GOAL.md objective; arbitrary GOAL.md is not auto-loaded"
    claude: "uses @GOAL.md and requires transcript-visible evidence plus bounded stop-and-report"
    grok_build: "uses an explicit read; @GOAL.md inside /goal and provider handoff remain UNVERIFIED"
    oh_my_pi: "uses an explicit read and reports goal.enabled or plan/vibe conflicts; budget exhaustion is not completion"
    kimi_code: "uses an explicit read; headless creation is separate and provider handoff remains UNVERIFIED"
    generic: "asks for a concrete platform and keeps the contract chat-only when root or authorization is unclear"
