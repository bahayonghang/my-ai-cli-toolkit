interface:
  display_name: "Goal Meta Skill"
  short_description: "Turn vague work into a best-default /goal command for Claude Code or Codex, with direct-copy Chinese and English-compatible versions."
  default_prompt: "Use $goal-meta-skill to turn this vague task into a strong /goal command for my platform (Claude Code or Codex). If I use Chinese, keep the command prefix as /goal and first provide 推荐执行版（中文，可直接复制）, then an English-compatible mirror unless I ask for one language only. Choose conservative defaults when low-risk, ask only numbered high-impact choices, use discovery-first goals for unfamiliar or specialized domains, and keep inline objectives/conditions under 4,000 characters or point to a file. On Codex, manage existing goals with /goal view/pause/resume/clear. On Claude Code, write the goal as a completion condition with transcript-visible proof and a turn/time bounding clause, never suggest /goal pause or /goal resume, and write pause conditions as stop-and-report."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "drafts structured Codex /goal thread objectives with pause/resume management from available task context"
    claude: "drafts native Claude Code /goal completion conditions with transcript-visible proof, bounding clauses, and stop-and-report pause semantics"
    generic: "uses the canonical goal template and asks for missing criteria when needed"
