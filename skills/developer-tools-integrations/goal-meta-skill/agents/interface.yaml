interface:
  display_name: "Goal Meta Skill"
  short_description: "Draft verifiable cross-platform /goal commands and optionally persist one approved root GOAL.md handoff."
  default_prompt: "Use $goal-meta-skill to turn this task into a project-aware /goal for Claude Code, Codex, Grok Build, Oh My Pi, or Kimi Code. Reconnaissance stays read-only. Use a bounded interview only for material human decisions. Ordinary goals remain chat-only; if I explicitly request save, persistence, or fresh-Agent handoff, show the exact root GOAL.md contract and create/replace effect, wait for the relevant confirmation, then use only the governed stdin helper. Never claim GOAL.md auto-loads, never silently overwrite it, and never modify Git state. Return only the selected platform's short explicit-read launcher and label provider-backed handoff evidence UNVERIFIED when no real fresh-session transcript exists. For Trellis implementation, link concrete task artifacts, preserve commit-then-archive plus the parent release gate, and require trellis-implement / trellis-check dispatch unless the target project is in inline mode."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "grok-build"
    - "oh-my-pi"
    - "kimi-code"
    - "agent-skills-compatible"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    file_write: "one confirmed direct-child Markdown through persist_goal_contract.py"
    git_mutation: "forbid"
  degradation:
    openai: "uses an explicit read ./GOAL.md objective; arbitrary GOAL.md is not auto-loaded"
    claude: "uses @GOAL.md and requires transcript-visible evidence plus bounded stop-and-report"
    grok_build: "uses an explicit read; @GOAL.md inside /goal and provider handoff remain UNVERIFIED"
    oh_my_pi: "uses an explicit read and reports goal.enabled or plan/vibe conflicts; budget exhaustion is not completion"
    kimi_code: "uses an explicit read; headless creation is separate and provider handoff remains UNVERIFIED"
    generic: "asks for a concrete platform and keeps the contract chat-only when root or authorization is unclear"
