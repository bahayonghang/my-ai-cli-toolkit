interface:
  display_name: "Git Commit"
  short_description: "Plan, draft, or execute Conventional Commits via local git without [AI] or host attribution"
  default_prompt: "Use $git-commit to inspect the repo changes, decide whether staged-only or all-changes mode applies, split commits safely when needed, then draft or execute a Conventional Commit locally. Create the commit with local `git commit -F` only — never GitHub web, Contents API, GraphQL createCommitOnBranch, or MCP push_files / create_or_update_file — so GitHub does not show 'This commit was created on GitHub.com' or 'Committed via Cursor Agent'. Do not add `[AI]`, `Co-authored-by`, `Made-with`, or `git commit --trailer` for those keys; pass `--ai` only when the user says `加 AI 标记` or `add [AI] tag`. Agent-mode still attaches `Agent-Task` / `Agent-Model` / `Generated-By` trailers (and `Confidence` / `Scope-risk` / `Tested` when known) and enforces a `Why:` body line for feat/fix/refactor/perf. Repo config wins over skill defaults: honor commitlint type-enum / length limits, and when the repo already uses an AI attribution convention like `Assisted-by:`, emit that trailer instead of the private Agent-* group; never add `Signed-off-by` yourself. Switch to `chore(wip)` checkpoint mode when the user asks for a WIP / checkpoint commit. Disable agent-mode when the user says `no AI tag` or `不要 AI 标记`. Output language is auto-detected from your instruction, the request language, and the repo's commit history (English fallback); say `用中文提交` or `commit in English` to force one. After verifying the local commit, return repository, branch, commit SHA(s), verification results, remaining requested actions, and blockers to the main coordinator. Continue already-authorized push, PR creation, or other operations through gh-pr-release or the appropriate workflow without repeating authorization solely because the commit finished. A commit-only request grants no push or PR permission; failed commit verification blocks dependent steps, and unavailable continuation tools must be reported honestly."
