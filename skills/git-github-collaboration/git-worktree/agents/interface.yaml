interface:
  display_name: "Git Worktree"
  short_description: "Create, list, and safely remove isolated Git worktrees under one convention root"
  default_prompt: "Use $git-worktree to inspect the repository, resolve one convention root, ensure the repo .gitignore excludes that root (append the planned line when missing), then plan a new-branch worktree, list trees, remove an owned tree, or show prune candidates. Do not adopt foreign worktrees, check out an existing branch, copy secrets, commit, or open a pull request."
