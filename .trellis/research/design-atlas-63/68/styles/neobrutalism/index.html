<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A cut-paper coast in two inks. Isolate a plate to see which marks make the light on the water.">
<title>Low water | Tide register</title>
<style>
:root {
  --primary:#fdc800; --secondary:#432dd7; --surface:#fbfbf9; --ink:#1c293c;
  --paper:#f3e8cc; --canvas:var(--surface); --text:var(--ink); --rule:3px solid var(--ink);
  --sans:Inter,Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  --display:clamp(3.8rem,7.2vw,7rem); --shadow:5px 5px 0 var(--text); --radius:4px;
  --gutter:clamp(16px,4vw,64px); --ring:var(--secondary);
}
:root[data-dark] {--canvas:var(--ink); --text:var(--surface); --ring:var(--primary)}
* {box-sizing:border-box}
html,body {overflow-x:clip}
body {margin:0; background:var(--canvas); color:var(--text); font:0.9375rem/1.48 var(--sans)}
header {background:var(--primary); color:var(--ink); border-bottom:var(--rule)}
.bar,main {max-width:1536px; margin:auto; padding-inline:var(--gutter)}
.bar {min-height:84px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.name {display:flex; align-items:center; gap:12px; font-size:27px; font-weight:900; letter-spacing:-.045em}
.mark {position:relative; width:28px; height:28px; border:3px solid; border-radius:50%}
.mark::before,.mark::after {content:""; position:absolute; background:currentColor; inset:calc(50% - 1.5px) -7px auto; height:3px}
.mark::after {transform:rotate(90deg)}
button,label span {border:2px solid var(--ink); border-radius:var(--radius); background:var(--surface); color:var(--ink); font:700 15px var(--sans); min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; white-space:nowrap}
button {padding:0 14px; box-shadow:3px 3px var(--ink)}
.switch {width:26px; height:15px; border:2px solid; border-radius:12px; padding:1px; display:flex}
.switch::after {content:""; width:9px; height:9px; border-radius:50%; background:currentColor}
button[aria-pressed=true] .switch {justify-content:flex-end}
button:disabled,input:disabled + span {opacity:.6;cursor:not-allowed}
button:enabled:hover,label:hover input:enabled + span {text-decoration:underline}
button:active,label:active span {transform:translateY(1px)}
button:focus-visible,input:focus-visible + span {outline:3px solid var(--ring); outline-offset:3px}
button:focus-visible {outline-color:var(--secondary)}
main {display:grid; grid-template-columns:minmax(0, .86fr) minmax(0,1.6fr); grid-template-rows:auto 1fr; gap:40px clamp(32px,5vw,80px); padding-block:clamp(32px,5vw,80px)}
h1 {font-size:var(--display); font-weight:900; line-height:.91; letter-spacing:-.065em; margin:0 0 24px; max-width:5ch}
.intro p {font-size:21px; line-height:1.4; max-width:33ch; text-wrap:pretty; margin:0 0 32px}
fieldset {padding:0; margin:0; border:0; min-width:0}
legend,h2 {font:800 21px var(--sans); letter-spacing:-.03em; padding:0; margin:0 0 12px}
.choices {display:flex; gap:6px; flex-wrap:wrap}
label {position:relative}
input {position:absolute; opacity:0; width:1px; height:1px}
label span {padding:0 12px}
label span::before {content:""; width:12px; height:12px; border:2px solid; border-radius:50%}
input:checked + span {background:var(--primary); box-shadow:3px 3px var(--ink)}
input:checked + span::before {background:var(--ink); box-shadow:inset 0 0 0 2px var(--primary)}
figure {margin:0; align-self:start; grid-column:2; grid-row:1/3; border:3px solid var(--text); box-shadow:var(--shadow); color:var(--ink)}
.mount {position:relative; padding:clamp(22px,2.7vw,44px); background:var(--secondary)}
.sheet {position:relative; width:100%; aspect-ratio:1000/740; background:var(--paper)}
.sheet img {position:absolute; inset:0; width:100%; height:100%}
.cross {position:absolute; color:var(--surface); font:20px/1 var(--mono)}
.cross::before {content:"+"}
.tl,.bl {left:8px}.tr,.br {right:8px}.tl,.tr {top:4px}.bl,.br {bottom:4px}
figcaption {min-height:52px; display:flex; align-items:center; gap:12px; padding:8px 16px; border-top:var(--rule); background:var(--surface); font:15px var(--mono)}
figcaption::before {content:""; width:14px; height:14px; border:2px solid; box-shadow:3px 3px 0 var(--ink)}
.notes {grid-column:1; align-self:start; border-top:3px solid; padding-top:16px}
dl {margin:0}
dl div {display:grid; grid-template-columns:80px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid}
dt {font-weight:750}
dd {margin:0; text-wrap:pretty}
.study {font:13px var(--mono); margin:0 0 12px; display:flex; align-items:center; gap:9px}
.study::before {content:""; width:20px; height:4px; background:currentColor}
@media(max-width:800px) {
  .bar {min-height:68px}.name {font-size:21px}.mark {width:22px;height:22px}
  main {grid-template-columns:minmax(0,1fr); gap:24px; padding-block:28px}
  h1 {max-width:none; margin-bottom:12px}.intro p {font-size:17px; margin-bottom:20px}
  figure,.notes {grid-column:auto;grid-row:auto}
  label span {padding-inline:10px}.study {margin-bottom:8px}
}
@media(prefers-reduced-motion:reduce) {*,*::before,*::after {animation:none; transition:none}}
@media(forced-colors:active) {
  input:checked + span::before {border:4px double Highlight}
  .switch::after {forced-color-adjust:none; background:ButtonText}
  .sheet {forced-color-adjust:none}
}
</style>
</head>
<body>
<header><div class="bar"><div class="name"><i class="mark" aria-hidden="true"></i>Tide register</div><button type="button" aria-pressed="false"><i class="switch" aria-hidden="true"></i>Dark paper</button></div></header>
<main>
<section class="intro" aria-labelledby="title">
<div class="study">Digital relief study</div>
<h1 id="title">Low water</h1>
<p>A cut-paper coast in two inks. Isolate a plate to see which marks make the light on the water.</p>
<fieldset><legend>View plates</legend><div class="choices">
<label><input type="radio" name="plate" value="both" checked><span>Both plates</span></label>
<label><input type="radio" name="plate" value="kelp"><span>Kelp</span></label>
<label><input type="radio" name="plate" value="oxide"><span>Oxide</span></label>
</div></fieldset>
</section>
<figure><div class="mount">
<i aria-hidden="true" class="cross tl"></i><i aria-hidden="true" class="cross tr"></i>
<i aria-hidden="true" class="cross bl"></i><i aria-hidden="true" class="cross br"></i>
<div class="sheet">
<img id="kelp" src="../../../../../../skills/development-workflows/design-atlas/assets/reference/scandinavian/kelp.png" width="1000" height="740" alt="Headland, beacon and tidal cuts">
<img id="oxide" src="../../../../../../skills/development-workflows/design-atlas/assets/reference/scandinavian/oxide.png" width="1000" height="740" alt="Sun disc and broken reflection">
</div></div><figcaption role="status" aria-live="polite">Both plates on cream paper</figcaption></figure>
<section class="notes" aria-labelledby="notes"><h2 id="notes">Print notes</h2>
<dl><div><dt>Kelp</dt><dd>Headland, beacon and tidal cuts</dd></div>
<div><dt>Oxide</dt><dd>Sun disc and broken reflection</dd></div>
<div><dt>Register</dt><dd>1,000 × 740 pixels per plate</dd></div></dl>
</section>
</main>
<script>
const captions = {both:'Both plates', kelp:'Kelp plate', oxide:'Oxide plate'};
document.querySelector('fieldset').addEventListener('change', event => {
  const selection = event.target.value;
  for (const layer of document.querySelectorAll('.sheet img')) {
    layer.hidden = selection !== 'both' && layer.id !== selection;
  }
  document.querySelector('figcaption').textContent = captions[selection] + ' on cream paper';
});
const appearance = document.querySelector('button');
appearance.addEventListener('click', () => {
  const dark = document.documentElement.toggleAttribute('data-dark');
  appearance.setAttribute('aria-pressed', String(dark));
});
</script>
</body>
</html>
